<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное</title>
    <link href="css/style_beauty.css" rel="stylesheet">
    <link rel="stylesheet" href="css/extra_beauty.css">
</head>
<body>

<!-- ШАПКА -->
<header class="header">

    <div class="logo">
        <div class="logo-star">✦</div>
        <div class="logo-text">
            <h1>Clear Beauty</h1>
            <p>Услуги · Мастера · Салоны · Косметика</p>
        </div>
    </div>


    <div class="header-actions">

        <a aria-label="Избранное"
           class="icon-button favorite-icon"
           href="favorites_beauty.html"
           title="Избранное">

            <svg fill="none"
                 height="23"
                 stroke="currentColor"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 stroke-width="1.6"
                 viewBox="0 0 24 24"
                 width="23">

                <path d="M20.8 4.6a5.2 5.2 0 0 0-7.4 0L12 6l-1.4-1.4a5.2 5.2 0 0 0-7.4 7.4L12 20l8.2-8a5.2 5.2 0 0 0 .6-7.4z"></path>

            </svg>
        </a>

        <a aria-label="Профиль"
           class="icon-button profile-icon"
           href="profile_beauty.html"
           title="Профиль">

            <svg fill="none"
                 height="23"
                 stroke="currentColor"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 stroke-width="1.6"
                 viewBox="0 0 24 24"
                 width="23">

                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5 20c0-3.5 3.1-5.7 7-5.7s7 2.2 7 5.7"></path>

            </svg>
        </a>

    </div>
</header>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<main class="favorites-page">

    <section class="favorites-heading">

        <div>
            <h2>Избранное</h2>

        </div>

        <a href="index.html" class="back-to-catalog">
            ← Вернуться к поиску
        </a>

    </section>
<div class="favorites-empty" hidden>
    <div class="favorites-empty-icon">♡</div>
    <h2>Пока здесь пусто</h2>
    <p>Добавляйте любимых мастеров в избранное, чтобы они всегда были под рукой.</p>
</div>

<div class="masters-grid favorites-grid" hidden></div>
    
</main>

<script src="js/script.js"></script>
</body>
</html>
